<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSC 225 Lab 6 - Consuming a REST API</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; }
    button { padding: 10px 18px; font-size: 16px; cursor: pointer; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px 10px; text-align: left; }
    th { background: #eee; }
    #catPic { display: block; margin-top: 20px; max-width: 100%; width: 400px; border: 1px solid #ccc; }
    #status { margin-top: 12px; color: #a00; }
  </style>
</head>
<body>
  <h1>Cat Facts</h1>


  <img id="catPic" alt="A cat" src="cat.jpeg">

  <p><button id="loadBtn">Get Cat Facts</button></p>
  <div id="status"></div>

  <table id="factsTable">
    <thead>
      <tr><th>factId</th><th>fact</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
